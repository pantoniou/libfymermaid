# SPDX-License-Identifier: MIT
#
# The corpus is the point of this workflow: 1100+ cases that run in under a
# second and that no reviewer can hold in their head.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The dependencies are built from source; neither is packaged. Pin them so
  # that a red build means this repository changed, not an upstream did.
  LIBFYAML_REF: master
  LIBFYMD4C_REF: master

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            os: ubuntu-latest
            cmake_args: -DCMAKE_BUILD_TYPE=Release
          - name: asan
            os: ubuntu-latest
            cmake_args: -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON
          - name: clang
            os: ubuntu-latest
            cmake_args: -DCMAKE_BUILD_TYPE=Release
            cc: clang
          - name: static
            os: ubuntu-latest
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          # macOS coverage, as in fyai: release and ASAN on macos-latest.
          # Homebrew carries the build tools there, and sysctl counts the
          # cores where nproc is missing.
          - name: macos
            os: macos-latest
            cmake_args: -DCMAKE_BUILD_TYPE=Release
            cc: clang
          - name: macos-asan
            os: macos-latest
            cmake_args: -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON
            cc: clang

    steps:
      - uses: actions/checkout@v4

      - name: install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config git libtool autoconf automake \
            ${{ matrix.cc == 'clang' && 'clang' || '' }}

      - name: install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install pkg-config
          # the runner image carries CMake, but a future image may not
          command -v cmake >/dev/null || brew install cmake

      # nproc is GNU; macOS has sysctl instead. Cores only size the job
      # count, as in fyai.
      - name: count cores
        run: |
          if command -v nproc >/dev/null 2>&1; then
            echo "NJOBS=$(nproc)" >> "$GITHUB_ENV"
          else
            echo "NJOBS=$(sysctl -n hw.ncpu 2>/dev/null || echo 4)" >> "$GITHUB_ENV"
          fi

      - name: build libfyaml
        run: |
          git clone --depth 1 --branch "$LIBFYAML_REF" \
            https://github.com/pantoniou/libfyaml.git ../libfyaml
          cmake -S ../libfyaml -B ../libfyaml/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build ../libfyaml/build -j"$NJOBS"
          sudo cmake --install ../libfyaml/build
          # macOS has no ldconfig; an installed dylib carries its own path.
          if [ "$(uname)" = "Linux" ]; then sudo ldconfig; fi

      - name: build libfymd4c
        run: |
          git clone --depth 1 --branch "$LIBFYMD4C_REF" \
            https://github.com/pantoniou/libfymd4c.git ../libfymd4c
          cmake -S ../libfymd4c -B ../libfymd4c/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DMD4C_WITH_FYTS=OFF -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build ../libfymd4c/build -j"$NJOBS"
          sudo cmake --install ../libfymd4c/build
          if [ "$(uname)" = "Linux" ]; then sudo ldconfig; fi

      - name: configure
        env:
          CC: ${{ matrix.cc || 'gcc' }}
        run: cmake -S . -B build ${{ matrix.cmake_args }}

      - name: build
        run: cmake --build build -j"$NJOBS"

      - name: test
        run: ctest --test-dir build -j"$NJOBS" --output-on-failure

      # A golden that reads the terminal width would pass here and fail on a
      # developer's machine, so the suite is run at a width it must ignore.
      - name: test at a narrow width
        run: COLUMNS=40 ctest --test-dir build -j"$NJOBS" --output-on-failure

      # Only fymm_-prefixed symbols may leave the shared object. Linux only:
      # the check reads ELF dynamic symbols, and the visibility flags it
      # pins are the same compiler options on macOS.
      - name: check the exported ABI
        if: runner.os == 'Linux' && matrix.name == 'release'
        run: |
          leaked=$(nm -D --defined-only build/src/libfymermaid.so.* \
            | awk '$2 ~ /^[A-Z]$/ {print $3}' | grep -v '^fymm_' || true)
          if [ -n "$leaked" ]; then
            echo "these symbols should not be exported:" >&2
            echo "$leaked" >&2
            exit 1
          fi

      - name: check it installs and links
        if: matrix.name == 'release' || matrix.name == 'macos'
        run: |
          sudo cmake --install build
          if [ "$(uname)" = "Linux" ]; then sudo ldconfig; fi
          cat > /tmp/consumer.c <<'CONSUMER'
          #include <stdio.h>
          #include <libfymermaid.h>
          int main(void)
          {
                  struct fymm_diagram *d;
                  char *out;

                  d = fymm_parse("gitGraph\n commit\n", FYMM_NT, NULL);
                  if (!d || fymm_diagram_has_errors(d))
                          return 1;
                  out = fymm_render(d, NULL);
                  if (!out)
                          return 1;
                  fputs(out, stdout);
                  fymm_free(out);
                  fymm_diagram_destroy(d);
                  return 0;
          }
          CONSUMER
          # The installed Mach-O libraries carry @rpath IDs, so a consumer
          # outside the build tree resolves them through an rpath. The
          # directory comes from the installed package itself, not from a
          # path written into this file. On Linux the loader already looks
          # in the install directory, so the flag is accepted and unused.
          libdir=$(pkg-config --variable=libdir libfymermaid)
          ${{ matrix.cc || 'gcc' }} -std=gnu2x -o /tmp/consumer /tmp/consumer.c \
            $(pkg-config --cflags --libs libfymermaid) "-Wl,-rpath,$libdir"
          /tmp/consumer

  corpus:
    name: corpus coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The corpus is committed, so its shape can be checked without building
      # anything: every case must be listed, and every listed case must exist.
      - name: check the corpus manifests
        run: |
          rc=0
          for m in test/mermaid-suite/*/manifest.list; do
                  dir=$(dirname "$m")
                  while IFS=: read -r outcome file; do
                          case "$outcome" in
                          parses|fails) ;;
                          *) echo "$m: bad outcome '$outcome'" >&2; rc=1 ;;
                          esac
                          [ -f "$dir/$file" ] || {
                                  echo "$m: missing $file" >&2; rc=1; }
                  done < "$m"
                  for f in "$dir"/*.mmd; do
                          grep -q ":$(basename "$f")$" "$m" || {
                                  echo "$m: $f is not listed" >&2; rc=1; }
                  done
          done
          exit $rc
